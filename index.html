<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Решаване на триъгълник, трапец и успоредник</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Playfair Display & Caveat -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <style>
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-caveat { font-family: 'Caveat', cursive; }
    
    @keyframes floatMath {
      0% { transform: translateY(0px) scale(0.8); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(-25px) scale(1.2); opacity: 0; }
    }
    
    @keyframes writeAction {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(15deg); }
    }

    @keyframes subtleGlow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(253,224,71,0.5)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 10px rgba(253,224,71,0.9)); transform: scale(1.1); }
    }

    @keyframes rotateBgIcon {
      0% { transform: rotate(12deg) scale(1); }
      50% { transform: rotate(25deg) scale(1.1); }
      100% { transform: rotate(12deg) scale(1); }
    }

    .animate-float-math-1 { animation: floatMath 3s linear infinite; }
    .animate-float-math-2 { animation: floatMath 3s linear infinite 1s; }
    .animate-float-math-3 { animation: floatMath 3s linear infinite 2s; }
    .animate-write { animation: writeAction 0.8s ease-in-out infinite; transform-origin: 50px 55px; }
    .animate-idea-glow { animation: subtleGlow 2.5s infinite; }
    .animate-bg-icon { animation: rotateBgIcon 8s ease-in-out infinite; }

    /* АГРЕСИВЕН РЕСЕТ ЗА ПЕРФЕКТНО ПРИНТИРАНЕ НА МНОГО СТРАНИЦИ */
    @media print {
      @page { margin: 15mm; size: auto; }
      
      html, body, #root { 
        height: auto !important;
        min-height: auto !important;
        max-height: none !important;
        width: 100% !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        background: white !important;
        position: static !important;
      }

      .print-container {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        position: static !important;
      }

      .no-print { display: none !important; }
      
      .break-inside-avoid { 
        page-break-inside: avoid !important;
        break-inside: avoid !important; 
        display: block !important;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Главният React код -->
  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    // Взимане на SVG икони
    const RefreshCwIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 group-hover:rotate-180 transition-transform duration-500"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;

    const EyeOffIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>;

    const ChevronRightIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 shrink-0 opacity-80"><path d="m9 18 6-6-6-6"/></svg>;
    const CheckCircle2Icon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
    const ShuffleIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>;
    const LightbulbIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-yellow-300 shrink-0"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>;
    const Code2Icon = ({size, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size||"24"} height={size||"24"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-4 h-4 text-blue-300 shrink-0"}><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>;
    const PrinterIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
    const XIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    const InfoIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;

    // ==========================================
    // АНИМИРАНО ЧОВЕЧЕ
    // ==========================================
    const AnimatedCharacterIcon = () => (
      <div className="relative w-16 h-16 shrink-0 mr-1 perspective-1000">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]">
          <text x="15" y="30" fontSize="16" fill="#fde047" className="animate-float-math-1 font-bold">∑</text>
          <text x="75" y="25" fontSize="14" fill="#a78bfa" className="animate-float-math-2 font-bold">π</text>
          <text x="65" y="15" fontSize="12" fill="#67e8f9" className="animate-float-math-3 font-bold">x²</text>

    // Помощни функции за изписване и бутони
    const sqrt = (expr) => `<span style="white-space: nowrap; font-family: serif; display: inline-flex; align-items: baseline;">&radic;<span style="border-top: 1px solid currentColor; padding-top: 1px; margin-left: -1px; line-height: 1.1;">${expr}</span></span>`;
    const frac = (num, den) => `<span style="display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.2em; font-size: 0.9em; line-height: 1.1; font-family: serif;"><span style="border-bottom: 1px solid currentColor; padding: 0 0.1em;">${num}</span><span style="padding: 0 0.1em;">${den}</span></span>`;
    
    const t = (k, val) => `<button type="button" class="term-btn text-indigo-700 bg-indigo-50 hover:bg-indigo-100 font-bold border-b-2 border-dotted border-indigo-400 hover:border-indigo-600 transition-colors rounded px-1 mx-0.5" data-term="${k}">${val}</button>`;

    // РЕЧНИК С ТЕРМИНИ И ФОРМУЛИ (Разделени по фигури според контекста)
    const TERM_INFO = {
      'a_right': { title: 'Катет (<i>a</i>)', info: 'Страна в правоъгълен триъгълник, прилежаща към правия ъгъл.<br/><br/><b>Питагорова теорема:</b><br/> <i>a² + b² = c²</i>' },
      'b_right': { title: 'Катет (<i>b</i>)', info: 'Страна в правоъгълен триъгълник, прилежаща към правия ъгъл.<br/><br/><b>Питагорова теорема:</b><br/> <i>a² + b² = c²</i>' },
      'c_right': { title: 'Хипотенуза (<i>c</i>)', info: 'Хипотенуза е страната срещу правия ъгъл в правоъгълен триъгълник.<br/><br/><b>Питагорова теорема:</b><br/> <i>c² = a² + b²</i>' },
      'a_iso': { title: 'Бедро (<i>a</i>)', info: 'Една от двете равни страни в равнобедрен триъгълник.' },
      'c_iso': { title: 'Основа (<i>c</i>)', info: 'Третата (неравна) страна в равнобедрен триъгълник.' },
      'a_trap': { title: 'Голяма основа (<i>a</i>)', info: 'По-дългата от двете успоредни страни в трапец.' },
      'b_trap': { title: 'Малка основа (<i>b</i>)', info: 'По-късата от двете успоредни страни в трапец.' },
      'c_trap': { title: 'Бедро (<i>c</i>)', info: 'Неуспоредна страна в трапец.' },
      'hc_right': { title: 'Височина към хипотенузата (<i>h<sub>c</sub></i>)', info: `Перпендикуляр, спуснат от върха на правия ъгъл към хипотенузата <i>c</i>.<br/><br/>В правоъгълен триъгълник се намира чрез:<br/>1) Лице: <i>h<sub>c</sub></i> = ${frac('<i>a</i> &middot; <i>b</i>', '<i>c</i>')}<br/>2) Метрична зависимост: <i>h<sub>c</sub>² = a<sub>1</sub> &middot; b<sub>1</sub></i>` },
      'hc_iso': { title: 'Височина към основата (<i>h<sub>c</sub></i>)', info: 'Перпендикуляр, спуснат от върха срещу основата към нея. В равнобедрения триъгълник тази височина е едновременно медиана, ъглополовяща и симетрала на основата.' },
      'a1': { title: 'Проекция (<i>a<sub>1</sub></i>)', info: 'Ортогоналната проекция на катета <i>a</i> върху хипотенузата <i>c</i>.<br/><br/><b>Метрична зависимост:</b><br/> <i>a² = c &middot; a<sub>1</sub></i>' },
      'b1': { title: 'Проекция (<i>b<sub>1</sub></i>)', info: 'Ортогоналната проекция на катета <i>b</i> върху хипотенузата <i>c</i>.<br/><br/><b>Метрична зависимост:</b><br/> <i>b² = c &middot; b<sub>1</sub></i>' },
      'ma': { title: 'Медиана (<i>m<sub>a</sub></i>)', info: 'Отсечка, свързваща връх със средата на срещуположната страна <i>a</i>.' },
      'mb': { title: 'Медиана (<i>m<sub>b</sub></i>)', info: 'Отсечка, свързваща връх със средата на срещуположната страна <i>b</i>.' },
      'la': { title: 'Ъглополовяща (<i>l<sub>a</sub></i>)', info: 'Разделя ъгъла на две равни части.<br/><br/><b>Свойство:</b> Разделя срещуположната страна на части, чието отношение е равно на отношението на прилежащите към ъгъла страни.' },
      'lb': { title: 'Ъглополовяща (<i>l<sub>b</sub></i>)', info: 'Разделя ъгъла на две равни части.<br/><br/><b>Свойство:</b> Разделя срещуположната страна на части, чието отношение е равно на отношението на прилежащите към ъгъла страни.' },
      'ha': { title: 'Височина (<i>h<sub>a</sub></i>)', info: `Перпендикуляр, спуснат от връх към правата на срещуположната страна <i>a</i>.<br/><br/>Свързана е с лицето: <i>S</i> = ${frac('<i>a</i> &middot; <i>h<sub>a</sub></i>', '2')}` },
      'hb': { title: 'Височина (<i>h<sub>b</sub></i>)', info: 'Перпендикуляр, спуснат от връх към правата на срещуположната страна <i>b</i>.' },
      'r_tri': { title: 'Радиус на вписана окръжност (<i>r</i>)', info: 'Окръжност, която се допира до трите страни на триъгълника. Центърът ѝ е пресечната точка на ъглополовящите на триъгълника.<br/><br/><b>Връзка с лицето:</b> <i>S = p &middot; r</i> (където <i>p</i> е полупериметър).' },
      'r_trap': { title: 'Радиус на вписана окръжност (<i>r</i>)', info: 'Окръжност, която се допира до четирите страни на трапеца. Центърът ѝ е пресечната точка на ъглополовящите на ъглите му.<br/><br/><b>Свойство:</b> Диаметърът е равен на височината (<i>h = 2r</i>).' },
      'R_tri': { title: 'Радиус на описана окръжност (<i>R</i>)', info: 'Окръжност, минаваща през трите върха на триъгълника. Центърът на описаната окръжност е пресечната точка на симетралите на трите страни на триъгълника.' },
      'R_trap': { title: 'Радиус на описана окръжност (<i>R</i>)', info: 'Окръжност, минаваща през четирите върха на трапеца. Центърът на описаната окръжност е пресечната точка на симетралите на страните му.' },
      'R_rect': { title: 'Радиус на описана окръжност (<i>R</i>)', info: `Окръжност, минаваща през четирите върха на правоъгълника. Центърът ѝ е пресечната точка на диагоналите му, следователно <i>R</i> = ${frac('<i>d</i>', '2')}.` },
      'S_trap': { title: 'Лице (<i>S</i>)', info: `Мярка за площта на фигурата.<br/><br/><b>Формула за лице на трапец:</b><br/> <i>S</i> = ${frac('<i>(a + b)</i>', '2')} &middot; <i>h</i>` },
      'S_rect': { title: 'Лице (<i>S</i>)', info: 'Мярка за площта на фигурата.<br/><br/><b>Формула за лице на правоъгълник:</b><br/> <i>S = a &middot; b</i>' },
      'S_rhombus': { title: 'Лице (<i>S</i>)', info: `Мярка за площта на фигурата.<br/><br/><b>Формули за лице на ромб:</b><br/> 1) <i>S = a &middot; h</i><br/> 2) <i>S</i> = ${frac('<i>d<sub>1</sub> &middot; d<sub>2</sub></i>', '2')}` },
      'P': { title: 'Периметър (<i>P</i>)', info: 'Сборът от дължините на всички страни на дадена фигура.' },
      'd': { title: 'Диагонал (<i>d</i>)', info: 'Отсечка, свързваща два несъседни върха в многоъгълник.' },
      'd1': { title: 'Диагонал 1 (<i>d<sub>1</sub></i>)', info: 'Единият диагонал на четириъгълник. <br/><br/>В ромб диагоналите са взаимно перпендикулярни и разполовяват ъглите.' },
      'd2': { title: 'Диагонал 2 (<i>d<sub>2</sub></i>)', info: `Вторият диагонал на четириъгълник. <br/><br/><b>Лице на ромб:</b> <i>S</i> = ${frac('<i>d<sub>1</sub> &middot; d<sub>2</sub></i>', '2')}` },
      'h': { title: 'Височина (<i>h</i>)', info: 'Разстоянието между две успоредни прави (или страни).' },
      'x': { title: 'Проекция (<i>x</i>)', info: `Ортогонална проекция на бедро върху основа. <br/><br/>При равнобедрен трапец: <i>x</i> = ${frac('<i>(a - b)</i>', '2')}.` },
      'y': { title: 'Отсечка (<i>y</i>)', info: 'Част от основата на фигура или разстояние. Използва се при Питагорова теорема в по-сложни фигури.' },
      'a': { title: 'Страна (<i>a</i>)', info: 'Основна страна на фигурата.' },
      'b': { title: 'Страна (<i>b</i>)', info: 'Страна на фигурата.' },
      'c': { title: 'Страна (<i>c</i>)', info: 'Страна на фигурата.' }
    };

    // ==========================================
    // БАЗА ОТ ПОДБРАНИ ДАННИ
    // ==========================================
    const TASKS_DATA = {
      gen1: [
        { a: 6, b: 8, c: 10, a1: '3.6', b1: '6.4', hc: '4.8' },
        { a: 15, b: 20, c: 25, a1: '9', b1: '16', hc: '12' },
        { a: 9, b: 12, c: 15, a1: '5.4', b1: '9.6', hc: '7.2' }
      ],
      gen2_med: [
        { a: 6, b: 8, ma: sqrt('73'), mb: `2${sqrt('13')}`, maSq: 73, mbSq: 52 },
        { a: 8, b: 6, ma: `2${sqrt('13')}`, mb: sqrt('73'), maSq: 52, mbSq: 73 },
        { a: 12, b: 5, ma: sqrt('61'), mb: sqrt('150.25'), maSq: 61, mbSq: 150.25 }
      ],
      gen2_bis: [

        <div style={{ height: isPrint ? '180px' : '224px' }} className={`w-full bg-white flex items-center justify-center ${isPrint ? 'border border-gray-300 rounded-lg' : 'mb-6 border border-indigo-100 rounded-xl shadow-[inset_0_2px_10px_rgba(0,0,0,0.03)]'}`}>
          <svg viewBox={viewBoxStr} className="w-full h-full max-w-[280px]">
            {renderSvgContent()}
          </svg>
        </div>
      );
    };

    // ==========================================
    // ГЛАВЕН КОМПОНЕНТ APP
    // ==========================================
    function App() {
      const ALL_ID = 'all';
      const [selectedCategory, setSelectedCategory] = useState(ALL_ID);
      const [currentSeqIndex, setCurrentSeqIndex] = useState(0);
      const [currentProblem, setCurrentProblem] = useState(null);
      const [showSolution, setShowSolution] = useState(false);

      // Състояния за учителския режим
      const [clickCount, setClickCount] = useState(0);
      const [isTeacherMode, setIsTeacherMode] = useState(false);
      const [selectedTypesForPrint, setSelectedTypesForPrint] = useState([]);
      const [numPerType, setNumPerType] = useState(1);
      const [worksheetProblems, setWorksheetProblems] = useState([]);
      const [showPrintView, setShowPrintView] = useState(false);
      const [showPrintHint, setShowPrintHint] = useState(false);

      // Състояние за информационния панел (термин)
      const [activeTermInfo, setActiveTermInfo] = useState(null);

      const generateNewProblem = (categoryId) => {
        if (categoryId === ALL_ID) {
          const generator = generators[currentSeqIndex];
          setCurrentProblem({ ...generator.generate(), categoryTitle: generator.title });
          setCurrentSeqIndex((prev) => (prev + 1) % generators.length);
        } else {
          const generator = generators.find(g => g.id === categoryId);
          setCurrentProblem({ ...generator.generate(), categoryTitle: generator.title });
        }
        setShowSolution(false);
        setActiveTermInfo(null);
      };

      useEffect(() => {
        generateNewProblem(ALL_ID);
      }, []);

      // Прихващане на кликове върху бутоните с термини
      const handleTaskClick = (e) => {
        const btn = e.target.closest('.term-btn');
        if (btn) {
          const termKey = btn.getAttribute('data-term');
          if (TERM_INFO[termKey]) {
            setActiveTermInfo(TERM_INFO[termKey]);
          }
        }
      };

      // Логика за активиране на учителски режим (5 клика)
      const handleHeaderClick = () => {
        setClickCount((prev) => {
          const newCount = prev + 1;
          if (newCount >= 5) {
            setIsTeacherMode(true);
            return 0; // Ресетваме брояча
          }
          return newCount;
        });

        // Ресетваме брояча, ако не се клика бързо
        setTimeout(() => {
          setClickCount(0);
        }, 1500);
      };

      // Логика за създаване на работен лист
      const handleGenerateWorksheet = () => {
        if (selectedTypesForPrint.length === 0) return;
        
        const problems = [];
        selectedTypesForPrint.forEach(catId => {
           const generator = generators.find(g => g.id === catId);
           if(generator) {
              for(let i=0; i<numPerType; i++) {
                 // За принтиране махаме бутоните и ги оставяме като обикновен текст, за да е чисто
                 const problem = generator.generate();
                 const cleanTask = problem.task.replace(/<button[^>]*>|<\/button>/gi, '');
                 problems.push({
                    ...problem,
                    task: cleanTask,
                    categoryTitle: generator.title
                 });
              }
           }
        });
        setWorksheetProblems(problems);
        setIsTeacherMode(false);
        setShowPrintView(true);
        
        setTimeout(() => {
           setShowPrintHint(true);
        }, 300);
      };

      const getDisplayTitle = () => {
        if (selectedCategory === ALL_ID) {
          return currentProblem?.categoryTitle?.replace(/^\d+\.\s*/, '') || "Смесени задачи";
        }
        return generators.find(g => g.id === selectedCategory)?.title.replace(/^\d+\.\s*/, '');
      };

      // ==========================================
      // РЕНДЕРИРАНЕ НА РАБОТНИЯ ЛИСТ (ИЗГЛЕД ЗА ПЕЧАТ)
      // ==========================================
      if (showPrintView) {
        return (
          <div className="bg-white text-black font-serif print-container w-full" style={{ minHeight: '100vh', padding: '2rem' }}>
            
            {/* Контроли (скриват се при принтиране) */}
            <div className="no-print max-w-4xl mx-auto flex flex-col items-center justify-center mb-8 bg-slate-50 p-6 rounded-xl shadow-sm border border-slate-200">
              <div className="flex justify-center gap-4 mb-4">
                <button onClick={() => setShowPrintHint(true)} className="px-6 py-2.5 bg-indigo-600 text-white rounded-lg font-bold flex items-center gap-2 hover:bg-indigo-700 transition-colors shadow-sm">
                   <PrinterIcon /> Принтирай
                </button>
                <button onClick={() => setShowPrintView(false)} className="px-6 py-2.5 bg-white text-slate-700 border border-slate-300 rounded-lg font-bold flex items-center gap-2 hover:bg-slate-50 transition-colors shadow-sm">
                   <XIcon /> Затвори и се върни
                </button>
              </div>
            </div>
            
            {/* Съдържание на работния лист - Класическо блок позициониране за сигурно принтиране */}
            <div className="max-w-4xl mx-auto pb-10">
              <h1 className="text-2xl font-bold text-center mb-8 uppercase tracking-widest border-b-2 border-black pb-4">
                Работен лист: Решаване на триъгълник, трапец и успоредник
              </h1>
              
              <div>
                {worksheetProblems.map((prob, idx) => (
                   <div key={idx} className="break-inside-avoid mb-10" style={{ pageBreakInside: 'avoid', marginBottom: '2.5rem' }}>
                      
                      {/* Заглавие, текст и чертеж */}
                      <div style={{ display: 'flex', flexDirection: 'row', gap: '1rem', alignItems: 'flex-start', width: '100%' }}>
                         <div style={{ fontWeight: 'bold', fontSize: '1.125rem', width: '2rem', flexShrink: 0, paddingTop: '0.25rem' }}>{idx + 1}.</div>
                         
                         <div style={{ flex: '1 1 0%', paddingTop: '0.25rem' }}>
                            <div style={{ fontSize: '0.875rem', fontWeight: '600', color: '#6b7280', marginBottom: '0.5rem', letterSpacing: '0.025em' }}>
                               ({prob.categoryTitle})
                            </div>
                            <div style={{ fontSize: '1.1rem', lineHeight: '1.6', color: 'black' }} dangerouslySetInnerHTML={{__html: prob.task}} />
                         </div>
                         
                         {prob.drawing && (
                            <div style={{ width: '240px', flexShrink: 0 }}>
                               <div style={{ border: '1px solid #d1d5db', padding: '0.5rem', borderRadius: '0.5rem', backgroundColor: 'white', width: '100%' }}>
                                  <SvgDrawing type={prob.drawing} showSolution={false} isPrint={true} />
                               </div>
                            </div>
                         )}
                      </div>

                      {/* Място за решение */}
                      <div style={{ marginLeft: '3rem', marginTop: '1rem', height: '12rem', border: '1px dashed #9ca3af', borderRadius: '0.5rem', padding: '1rem', backgroundColor: 'rgba(249, 250, 251, 0.5)' }}>
                         <span style={{ color: '#9ca3af', fontStyle: 'italic' }}>Място за решение...</span>
                      </div>

                   </div>
                ))}
              </div>
            </div>

            {/* Указание за принтиране (Модал) */}
            {showPrintHint && (
              <div className="no-print fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                 <div className="bg-white rounded-2xl shadow-2xl p-6 text-center max-w-sm animate-in zoom-in-95 duration-200 border border-indigo-100">
                    <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                       <PrinterIcon />
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2 font-playfair">Отпечатване на листа</h3>
                    <p className="text-slate-600 mb-6 text-sm leading-relaxed">
                       Защитната среда на браузъра блокира директния печат чрез бутона. <br/><br/>
                       Моля, натиснете <b>Ctrl + P</b> (за Windows) или <b>Cmd + P</b> (за Mac) на вашата клавиатура, за да отворите прозореца за разпечатване.
                    </p>
                    <button onClick={() => setShowPrintHint(false)} className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold w-full transition-colors active:scale-95 shadow-md">
                       Разбрах
                    </button>
                 </div>
              </div>
            )}
          </div>
        );
      }

      // ==========================================
      // РЕНДЕРИРАНЕ НА ГЛАВНОТО ПРИЛОЖЕНИЕ
      // ==========================================
      return (
        <div className="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-slate-50 to-cyan-50 font-sans text-slate-800 flex flex-col selection:bg-indigo-200 selection:text-indigo-900">
          
          {/* Информационен панел (Справочник) */}
          {activeTermInfo && (
             <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[200] p-4 animate-in fade-in duration-200" onClick={() => setActiveTermInfo(null)}>
                <div className="bg-white rounded-2xl shadow-2xl p-7 w-full max-w-sm transform transition-all relative border-t-[5px] border-indigo-500" onClick={e => e.stopPropagation()}>
                   <button onClick={() => setActiveTermInfo(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full p-1.5 transition-colors">
                      <XIcon className="w-4 h-4" />
                   </button>
                   <div className="flex items-center gap-3 mb-5 border-b border-slate-100 pb-4">
                      <div className="p-2 bg-indigo-50 rounded-xl text-indigo-600 border border-indigo-100 shadow-sm">
                        <InfoIcon />
                      </div>
                      <h3 className="text-xl font-bold font-playfair text-indigo-900" dangerouslySetInnerHTML={{__html: activeTermInfo.title}}></h3>
                   </div>
                   <p className="text-slate-700 leading-relaxed text-[1.05rem]" dangerouslySetInnerHTML={{__html: activeTermInfo.info}}></p>
                   
                   <div className="mt-6 text-center">
                     <button onClick={() => setActiveTermInfo(null)} className="px-6 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg font-bold transition-colors w-full">
                       Разбрах
                     </button>
                   </div>
                </div>
             </div>
          )}

          {/* Хедър с тайно активиране */}
          <header 
             onClick={handleHeaderClick}
             className="bg-gradient-to-r from-indigo-950 via-violet-900 to-purple-900 shadow-xl px-6 py-4 flex items-center gap-4 border-b-[4px] border-indigo-400 relative overflow-hidden z-20 cursor-default select-none"
          >
            <AnimatedCharacterIcon />
            <h1 className="text-2xl md:text-3xl tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-yellow-100 to-indigo-100 font-caveat drop-shadow-[0_2px_4px_rgba(0,0,0,0.4)]">
              Решаване на триъгълник, трапец и успоредник
            </h1>
            <div className="absolute right-0 top-0 opacity-10 pointer-events-none transform translate-x-1/4 -translate-y-1/4">
               <svg width="200" height="200" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="white" strokeWidth="2" fill="none"/><path d="M10 50 L90 50 M50 10 L50 90" stroke="white" strokeWidth="1"/></svg>
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden flex-col md:flex-row relative">
            
            {/* Странична лента с 3D бутони */}
            <aside className="w-full md:w-[360px] bg-white/40 backdrop-blur-md border-r border-slate-200/60 overflow-y-auto shrink-0 shadow-[4px_0_15px_-3px_rgba(0,0,0,0.05)] p-5 flex flex-col z-10">
              <div className="text-xs font-bold text-indigo-900/60 uppercase tracking-widest mb-4 flex items-center gap-2">
                <BookOpenIcon /> Съдържание
              </div>
              
              <nav className="flex flex-col gap-5 pb-6">
                <div className="h-[3.8rem] relative group mb-2">
                  <button
                    onClick={() => {
                      setSelectedCategory(ALL_ID);
                      generateNewProblem(ALL_ID);
                    }}
                    className={`absolute inset-0 w-full px-4 rounded-xl font-bold text-white transition-all duration-150 flex items-center justify-between outline-none
                      ${selectedCategory === ALL_ID
                         ? `bg-slate-800 translate-y-1 shadow-[inset_0_4px_4px_rgba(0,0,0,0.15)] ring-2 ring-offset-2 ring-slate-400`
                         : `bg-slate-700 border-b-[4px] border-slate-900 hover:brightness-110 active:border-b-0 active:translate-y-1`
                      }
                    `}
                  >
                    <span className="text-sm drop-shadow-sm text-left leading-tight pr-2 flex items-center gap-2">
                      <ShuffleIcon /> Всички теми (Редуване)
                    </span>
                    {selectedCategory === ALL_ID && <ChevronRightIcon />}
                  </button>
                </div>

                {generators.map((gen, index) => {
                  const style = CATEGORY_STYLES[index % CATEGORY_STYLES.length];
                  const isSelected = selectedCategory === gen.id;
                  
                  return (
                    <div key={gen.id} className="h-[3.8rem] relative group">
                      <button
                        onClick={() => {
                          setSelectedCategory(gen.id);
                          generateNewProblem(gen.id);
                        }}
                        className={`absolute inset-0 w-full px-4 rounded-xl font-bold text-white transition-all duration-150 flex items-center justify-between outline-none
                          ${isSelected
                             ? `${style.bg} translate-y-1 shadow-[inset_0_4px_4px_rgba(0,0,0,0.15)] ring-2 ring-offset-2 ${style.ring}`
                             : `${style.bg} border-b-[4px] ${style.border} hover:brightness-110 active:border-b-0 active:translate-y-1`
                          }
                        `}
                      >
                        <span className="text-sm drop-shadow-sm text-left leading-tight pr-2 line-clamp-2">{gen.title}</span>
                        {isSelected && <ChevronRightIcon />}
                      </button>
                    </div>
                  );
                })}
              </nav>

              {/* Специален панел за авторство */}
              <div className="mt-auto pt-4 pb-2">
                <div className="bg-gradient-to-br from-indigo-900 to-violet-900 p-5 rounded-2xl text-indigo-50 shadow-xl relative overflow-hidden border border-indigo-700/50 group cursor-default">
                  <div className="absolute -top-4 -right-4 opacity-10 animate-bg-icon">
                    <Code2Icon size="100" className="text-white" />
                  </div>
                  <h4 className="font-playfair font-bold text-base mb-3 text-indigo-200 flex items-center gap-2 relative z-10">
                     Съвместен проект
                  </h4>
                  <div className="text-[0.85rem] leading-relaxed opacity-95 space-y-3 relative z-10">
                    <div className="flex items-center gap-2.5">
                       <div className="animate-idea-glow shrink-0"><LightbulbIcon /></div>
                       <span><b>Идея и педагогически решения:</b> Валя Витковска</span>
                    </div>
                    <div className="flex items-center gap-2.5">
                       <Code2Icon className="w-4 h-4 text-blue-300 shrink-0 transition-transform duration-700 group-hover:rotate-180" />
                       <span><b>Реализация:</b> AI Gemini</span>
                    </div>
                  </div>
                </div>
              </div>
            </aside>

            {/* Основна част */}
            <main className="flex-1 p-4 md:p-8 overflow-y-auto relative z-10">
              <div className="max-w-3xl mx-auto space-y-6">
                
                {/* Контролен панел */}
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white/80 backdrop-blur-md px-6 py-4 rounded-xl shadow-sm border border-indigo-100/50">
                  <div className="flex items-center gap-3 text-indigo-900">
                    <span className="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold font-playfair">
                      {selectedCategory === ALL_ID ? '∞' : selectedCategory}
                    </span>
                    <h2 className="font-semibold text-lg font-playfair">{getDisplayTitle()}</h2>
                  </div>
                  <button
                    onClick={() => generateNewProblem(selectedCategory)}
                    className="flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-md active:scale-95 w-full sm:w-auto justify-center group border border-indigo-500"
                  >
                    <RefreshCwIcon />
                    <span>Генерирай задача</span>
                  </button>
                </div>

                {/* Карта на задачата */}
                {currentProblem && (
                  <div className="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-indigo-50 overflow-hidden">
                    <div className="p-6 md:p-10">
                      
                      {/* Чертеж */}
                      <SvgDrawing type={currentProblem.drawing} showSolution={showSolution} isPrint={false} />

                      {/* Текст на задачата - Интерактивен */}
                      <div className="relative border-l-[5px] border-indigo-600 bg-gradient-to-r from-indigo-50/50 to-transparent p-6 sm:p-8 rounded-r-2xl mb-8 shadow-[inset_2px_0_10px_rgba(79,70,229,0.03)]">
                        <span className="absolute -top-3 left-6 bg-white px-4 py-0.5 text-xs font-bold tracking-widest text-indigo-700 border border-indigo-100 rounded-full shadow-sm flex items-center gap-1.5">
                          <LightbulbIcon />
                          КЛИКНЕТЕ ВЪРХУ ОЗНАЧЕНИЯТА ЗА ПОДСКАЗКА
                        </span>
                        <h3 className="text-xl text-slate-800 leading-relaxed font-playfair font-semibold mt-2"
                            onClick={handleTaskClick}
                            dangerouslySetInnerHTML={{ __html: currentProblem.task }}>
                        </h3>
                      </div>

                      {/* Бутон за показване на решение */}
                      <div className="pt-2 border-t border-slate-100 flex justify-center md:justify-start">
                        <button
                          onClick={() => setShowSolution(!showSolution)}
                          className={`flex items-center gap-2 font-medium px-6 py-2.5 rounded-full transition-all duration-300 border ${
                            showSolution 
                              ? 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200 shadow-inner' 
                              : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 shadow-md hover:shadow-lg transform hover:-translate-y-0.5'
                          }`}
                        >
                          {showSolution ? <EyeOffIcon /> : <EyeIcon />}
                          {showSolution ? 'Скрий решението' : 'Покажи решението'}
                        </button>
                      </div>
                      
                      {/* Решение - Стъпково */}
                      {showSolution && (
                        <div className="mt-8 animate-in fade-in slide-in-from-top-4 duration-500">
                          <h4 className="font-bold text-slate-800 mb-6 flex items-center gap-2 uppercase tracking-widest text-sm border-b pb-3 border-indigo-100">
                            Стъпки за решение
                          </h4>
                          <ol className="space-y-6">
                            {currentProblem.solution.map((step, idx) => (
                              <li key={idx} className="flex gap-4 items-start group">
                                <span className="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-gradient-to-br from-indigo-100 to-violet-100 text-indigo-800 font-bold text-sm group-hover:from-indigo-600 group-hover:to-violet-600 group-hover:text-white transition-all duration-300 shadow-sm border border-indigo-200 group-hover:border-transparent">
                                  {idx + 1}
                                </span>
                                <p className="text-slate-700 leading-[1.7] font-serif text-[1.15rem] pt-1" 
                                   dangerouslySetInnerHTML={{ __html: step }}>
                                </p>
                              </li>
                            ))}
                          </ol>
                          
                          <div className="mt-10 flex items-center justify-end text-emerald-600 font-bold gap-2 font-playfair border-t border-dashed border-emerald-200 pt-5 text-lg">
                            <CheckCircle2Icon />
                            <span>Край на решението</span>
                          </div>
                        </div>
                      )}

                    </div>
                  </div>
                )}
              </div>
            </main>
          </div>

          {/* ================= УЧИТЕЛСКИ ПАНЕЛ (МОДАЛ) ================= */}
          {isTeacherMode && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[300] p-4">
               <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden animate-in fade-in zoom-in-95 duration-300">
                  
                  <div className="bg-gradient-to-r from-indigo-800 to-violet-800 px-6 py-4 flex justify-between items-center text-white">
                     <div className="flex items-center gap-3">
                        <PrinterIcon />
                        <h2 className="font-bold text-lg tracking-wide uppercase font-playfair">Учителски режим - Работен лист</h2>
                     </div>
                     <button onClick={() => setIsTeacherMode(false)} className="hover:bg-white/20 p-1.5 rounded-lg transition-colors">
                        <XIcon className="text-white" />
                     </button>
                  </div>

                  <div className="p-6 max-h-[60vh] overflow-y-auto">
                     <p className="text-slate-600 mb-6 font-medium">
                        Изберете от кои теми да се генерират задачи за принтиране:
                     </p>
                     
                     <div className="space-y-3 mb-8">
                        {generators.map(gen => (
                           <label key={gen.id} className="flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-colors">
                              <input 
                                 type="checkbox" 
                                 className="w-5 h-5 accent-indigo-600 cursor-pointer text-indigo-600 rounded"
                                 checked={selectedTypesForPrint.includes(gen.id)}
                                 onChange={(e) => {
                                    if (e.target.checked) {
                                       setSelectedTypesForPrint(prev => [...prev, gen.id]);
                                    } else {
                                       setSelectedTypesForPrint(prev => prev.filter(id => id !== gen.id));
                                    }
                                 }}
                              />
                              <span className="font-medium text-slate-700">{gen.title}</span>
                           </label>
                        ))}
                     </div>

                     <div className="flex items-center gap-4 bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                        <label className="font-semibold text-indigo-900">Брой задачи от всеки избран вид:</label>
                        <input 
                           type="number" 
                           min="1" 
                           max="10" 
                           value={numPerType} 
                           onChange={(e) => setNumPerType(Number(e.target.value) || 1)}
                           className="w-20 px-3 py-2 border border-indigo-300 rounded-lg font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-500 text-center"
                        />
                     </div>
                  </div>

                  <div className="p-6 bg-slate-50 border-t border-slate-200 flex justify-end gap-3">
                     <button 
                        onClick={() => setIsTeacherMode(false)}
                        className="px-6 py-2.5 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-colors"
                     >
                        Отказ
                     </button>
                     <button 
                        onClick={handleGenerateWorksheet}
                        disabled={selectedTypesForPrint.length === 0}
                        className="flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-md active:scale-95"
                     >
                        <PrinterIcon />
                        Генерирай и Принтирай
                     </button>
                  </div>
               </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
